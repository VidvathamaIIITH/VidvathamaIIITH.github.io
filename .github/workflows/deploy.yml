name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job widens this for itself only.
permissions:
  contents: read

# One deployment at a time, and never cancel one that is already running —
# GitHub's recommended setting for Pages. Publishing twice in quick succession
# from the admin portal therefore queues rather than collides.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm run test

      # `npm run build` also runs scripts/postbuild.mjs, which writes 404.html
      # (the SPA fallback that makes /admin survive a hard refresh), robots.txt
      # and sitemap.xml against the real deployment URL.
      - name: Build
        env:
          # Repository variable BASE_PATH lets the same source deploy to a user
          # site ("/") or a project site ("/repo-name/") without a code change.
          VITE_BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: main
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Publishes on a push to main and on a manual run; never from a pull request.
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # A run cancelled *after* it has created a Pages deployment leaves that
      # deployment stuck "in progress" forever, and every later deploy then
      # fails with "due to in progress deployment". Publishing several times in
      # a row from the admin portal is enough to trigger it. Clearing stale
      # deployments here makes the pipeline self-healing instead of wedged.
      #
      # Concurrency guarantees no sibling run is deploying at this point, so
      # anything still pending is stale by definition.
      - name: Clear any stuck Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=30"                   --jq '.[].id' 2>/dev/null || true)
          for id in $ids; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=1"                       --jq '.[0].state // "pending"' 2>/dev/null || echo unknown)
            case "$state" in
              pending|queued|in_progress)
                echo "Clearing stale Pages deployment $id (state: $state)"
                gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$id/cancel" >/dev/null 2>&1                   || gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses"                        -f state=inactive >/dev/null 2>&1 || true
                ;;
            esac
          done

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
