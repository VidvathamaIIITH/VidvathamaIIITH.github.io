    <!-- Paint the correct background before React mounts, so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (e) {
          /* Storage can throw in private mode; the system theme is a fine fallback. */
        }
      })();
    </script>
